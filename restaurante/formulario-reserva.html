<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="author" content="Pablo Garcia Pavon"><meta name="description" content="Formulario de reserva del Restaurante."><meta name="keywords" content="reserva, restaurante, mesa, formulario"><title>Reserva</title><link rel="icon" href="img/logo.png" type="image/png"></head>
<body>
<header><h1>Formulario de reserva</h1></header>
<main><section><article>
<form action="#" method="post"><fieldset><legend>Datos de la reserva</legend>
<p><label for="nombre">Nombre y apellidos:</label><br><input type="text" id="nombre" name="nombre" required></p>
<p><label for="email">Correo electrónico:</label><br><input type="email" id="email" name="email" required></p>
<p><label for="telefono">Teléfono:</label><br><input type="tel" id="telefono" name="telefono" required></p>
<p><label for="fecha">Fecha:</label><br><input type="date" id="fecha" name="fecha" required></p>
<p><label for="hora">Hora:</label><br><input type="time" id="hora" name="hora" required></p>
<p><label for="personas">Número de personas:</label><br><input type="number" id="personas" name="personas" min="1" max="20" required></p>
<p><label for="observaciones">Observaciones:</label><br><textarea id="observaciones" name="observaciones"></textarea></p>
<p><input type="submit" value="Solicitar reserva"></p>
</fieldset></form>
</article></section></main>
<footer>
<p><a href="formularios.html">Volver a Formularios</a></p>
</footer>
</body></html>
