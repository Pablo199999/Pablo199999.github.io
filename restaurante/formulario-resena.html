<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="author" content="Pablo Garcia Pavon"><meta name="description" content="Formulario para dejar una reseña del Restaurante."><meta name="keywords" content="reseña, restaurante, valoración, formulario"><title>Dejar reseña</title><link rel="icon" href="img/logo.png" type="image/png"></head>
<body>
<header><h1>Formulario de dejar reseña</h1></header>
<main><section><article>
<form action="#" method="post"><fieldset><legend>Tu reseña</legend>
<p><label for="nombre">Nombre:</label><br><input type="text" id="nombre" name="nombre" required></p>
<p><label for="plato">Plato:</label><br><select id="plato" name="plato" required><option value="">Selecciona un plato</option><option value="tortilla">Tortilla de Patatas</option><option value="salmorejo">Salmorejo</option><option value="bravas">Patatas Bravas</option></select></p>
<p><label for="valoracion">Valoración:</label><br><select id="valoracion" name="valoracion" required><option value="">Selecciona una valoración</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></p>
<p><label for="resena">Reseña:</label><br><textarea id="resena" name="resena" required></textarea></p>
<p><input type="submit" value="Enviar reseña"></p>
</fieldset></form>
</article></section></main>
<footer>
<p><a href="formularios.html">Volver a Formularios</a></p>
</footer>
</body></html>
