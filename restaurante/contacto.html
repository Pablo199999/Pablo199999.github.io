<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pablo García Pavón">
    <meta name="description" content="Formulario de contacto con Sabores de Córdoba.">
    <meta name="keywords" content="restaurante, Córdoba, contacto">
    <title>Contacto</title>
</head>
<body>
<header>
    <h1>Contacto</h1>
</header>
<main>
<form action="#" method="post">
<p><label for="nombre">Su nombre:</label><br><input id="nombre" name="nombre" type="text" required></p>
<p><label for="correo">Su correo electrónico:</label><br><input id="correo" name="correo" type="email" required></p>
<p><label for="telefono">Su teléfono:</label><br><input id="telefono" name="telefono" type="tel"></p>
<p><label for="asunto">Asunto:</label><br><input id="asunto" name="asunto" type="text" required></p>
<p><label for="mensaje">Su mensaje:</label><br><textarea id="mensaje" name="mensaje" rows="8" cols="50" maxlength="300" required></textarea></p>
<button type="submit">Enviar</button> <button type="reset">Limpiar</button>
</form>
</main>
<nav>
    <a href="index.html">Volver a la página de Restaurante</a>
</nav>
</body>
</html>
