<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pablo García Pavón">
    <meta name="description" content="Formulario de inscripción en ciclos formativos de grado superior.">
    <meta name="keywords" content="formulario, inscripción, ciclos formativos, grado superior">
    <title>Formulario de inscripción</title>
</head>
<body>
<header>
    <h1>Hoja de inscripción</h1>
    <h2>En los ciclos formativos de grado superior</h2>
</header>
<main>
<form action="#" method="post">
    <fieldset>
        <legend>Datos personales</legend>
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" required>
            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="dni" required>
        </p>
        <p>
            <label for="localidad">Localidad de nacimiento:</label>
            <input type="text" id="localidad" name="localidad" required>
            <label for="provincia">Provincia:</label>
            <select id="provincia" name="provincia" required>
                <option value="">Selecciona una provincia</option>
                <option value="Huelva">Huelva</option>
                <option value="Sevilla">Sevilla</option>
                <option value="Córdoba">Córdoba</option>
                <option value="Cádiz">Cádiz</option>
                <option value="Granada">Granada</option>
                <option value="Jaén">Jaén</option>
                <option value="Málaga">Málaga</option>
                <option value="Almería">Almería</option>
                <option value="Otra">Otra</option>
            </select>
            <label for="fecha">Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="fecha" required>
        </p>
        <p>
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" required>
            <label for="codigo-postal">Código postal:</label>
            <input type="text" id="codigo-postal" name="codigo_postal" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required>
        </p>
    </fieldset>

    <fieldset>
        <legend>Forma de acceso</legend>
        <p><input type="radio" id="acceso-directo" name="forma_acceso" value="directo" required> <label for="acceso-directo">Directo</label></p>
        <p>
            <input type="radio" id="bachillerato" name="via_directa" value="bachillerato">
            <label for="bachillerato">Bachillerato Log. Modalidad</label>
            <input type="text" id="modalidad" name="modalidad">
        </p>
        <p><input type="radio" id="experimental" name="via_directa" value="experimental"> <label for="experimental">Experimental</label></p>
        <p>
            <input type="radio" id="cou" name="via_directa" value="cou">
            <label for="cou">COU Opción</label>
            <input type="text" id="opcion-cou" name="opcion_cou">
        </p>
        <p><input type="radio" id="fp2" name="via_directa" value="fp2"> <label for="fp2">FP2</label></p>
        <p>
            <input type="radio" id="otros" name="via_directa" value="otros">
            <label for="otros">Otros (especifique)</label>
            <input type="text" id="otros-especificar" name="otros_especificar">
        </p>
        <p><input type="radio" id="prueba-libre" name="forma_acceso" value="prueba_libre"> <label for="prueba-libre">Prueba libre</label></p>
    </fieldset>

    <fieldset>
        <legend>Documentos adjuntados</legend>
        <p><input type="checkbox" id="dni-adjunto" name="documentos[]" value="fotocopia_dni"> <label for="dni-adjunto">Fotocopia DNI</label></p>
        <p><input type="checkbox" id="certificado" name="documentos[]" value="certificado_academico"> <label for="certificado">Certificado académico</label></p>
        <p>
            <input type="checkbox" id="otros-documentos" name="documentos[]" value="otros">
            <label for="otros-documentos">Otros documentos (especifique)</label>
            <input type="text" id="especificar-documentos" name="especificar_documentos">
        </p>
    </fieldset>

    <p><button type="submit">Enviar solicitud</button> <button type="reset">Limpiar datos</button></p>
</form>
</main>
<footer>
    <a href="index.html">Volver a Formularios</a>
</footer>
</body>
</html>
