<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pablo García Pavón">
    <meta name="description" content="Formulario para formar parte del club Amigos de la informática.">
    <meta name="keywords" content="formulario, club, informática, datos personales">
    <title>Formulario del club</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
    <h1>Formulario del club</h1>
    <p>Rellena el siguiente cuestionario para formar parte del club de "Amigos de la informática"</p>
</header>
<main>
<form action="#" method="post">
    <fieldset class="datos">
        <legend>Datos personales</legend>
        <div class="linea"><label class="etiqueta" for="nombre">Nombre:</label><input type="text" id="nombre" name="nombre" required></div>
        <div class="linea"><label class="etiqueta" for="domicilio">Domicilio:</label><input type="text" id="domicilio" name="domicilio" placeholder="calle, número y localidad"></div>
        <div class="linea"><label class="etiqueta" for="pais">País de origen:</label>
            <select id="pais" name="pais"><option value="España" selected>España</option><option value="Francia">Francia</option><option value="Portugal">Portugal</option><option value="Otro">Otro</option></select></div>
        <div class="linea"><label class="etiqueta" for="fecha">Fecha de nacimiento:</label><input type="date" id="fecha" name="fecha"></div>
        <div class="linea"><label class="etiqueta" for="correo">Correo electrónico:</label><input type="email" id="correo" name="correo"></div>
        <div class="linea"><label class="etiqueta" for="telefono">Teléfono:</label><input type="tel" id="telefono" name="telefono"></div>
        <div class="linea"><span class="etiqueta">Estado civil:</span>
            <input type="radio" id="soltero" name="estado_civil" value="soltero"><label for="soltero">Soltero/a</label>
            <input type="radio" id="casado" name="estado_civil" value="casado"><label for="casado">Casado/a</label>
            <input type="radio" id="separado" name="estado_civil" value="separado"><label for="separado">Separado/a</label>
            <input type="radio" id="viudo" name="estado_civil" value="viudo"><label for="viudo">Viudo/a</label>
        </div>
        <div class="linea"><span class="etiqueta">Sexo:</span>
            <input type="radio" id="hombre" name="sexo" value="hombre"><label for="hombre">Hombre</label>
            <input type="radio" id="mujer" name="sexo" value="mujer"><label for="mujer">Mujer</label>
        </div>
    </fieldset>
    <fieldset class="interes">
        <legend>Otra información de interés</legend>
        <div class="linea"><label class="pregunta" for="componentes">Seleccione los componentes electrónicos con los que habitualmente trabajas:</label>
        <select id="componentes" name="componentes" multiple size="4">
            <option value="movil">Móvil</option><option value="tablet">Tablet</option><option value="ordenador">Ordenador</option><option value="ebook">Ebook</option>
        </select></div>
        <p class="pregunta">Seleccione tus actividades favoritas:</p>
        <div class="actividades">
            <div class="opcion"><input type="checkbox" id="deporte" name="actividades" value="deporte"><label for="deporte">Hacer deporte</label></div>
            <div class="opcion"><input type="checkbox" id="amigos" name="actividades" value="amigos"><label for="amigos">Salir con mis amigos</label></div>
            <div class="opcion"><input type="checkbox" id="series" name="actividades" value="series"><label for="series">Ver series, pelis,...</label></div>
            <div class="opcion"><input type="checkbox" id="senderismo" name="actividades" value="senderismo"><label for="senderismo">Realizar rutas de senderismo</label></div>
            <div class="opcion"><input type="checkbox" id="cine" name="actividades" value="cine"><label for="cine">Ir al cine</label></div>
            <div class="opcion"><input type="checkbox" id="musica" name="actividades" value="musica"><label for="musica">Escuchar música</label></div>
        </div>
        <div class="linea"><label class="pregunta" for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label>
        <textarea id="motivo" name="motivo" rows="4" cols="50"></textarea></div>
        <div class="linea"><label class="pregunta" for="pelicula">Elige o escribe tu peli favorita:</label><input type="text" id="pelicula" name="pelicula"></div>
    </fieldset>
    <div class="botones"><button type="submit">Enviar</button> <button type="reset">Cancelar</button></div>
</form>
</main>
<footer><a href="index.html">Volver a Formularios</a></footer>
</body>
</html>
