<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Pablo García Pavón">
    <meta name="description" content="Formulario para formar parte del club Amigos de la informática.">
    <meta name="keywords" content="formulario, club, informática, datos personales">
    <title>Formulario del club</title>
</head>
<body>
<header>
    <h1>Formulario del club</h1>
    <p>Rellena el siguiente cuestionario para formar parte del club de "Amigos de la informática"</p>
</header>
<main>
<form action="#" method="post">
    <fieldset>
        <legend>Datos personales</legend>
        <p><label for="nombre">Nombre:</label><br><input type="text" id="nombre" name="nombre" size="40" required></p>
        <p><label for="domicilio">Domicilio:</label><br><input type="text" id="domicilio" name="domicilio" size="40" placeholder="calle, número y localidad"></p>
        <p><label for="pais">País de origen:</label><br>
        <select id="pais" name="pais"><option value="España" selected>España</option><option value="Francia">Francia</option><option value="Portugal">Portugal</option><option value="Otro">Otro</option></select></p>
        <p><label for="fecha">Fecha de nacimiento:</label><br><input type="date" id="fecha" name="fecha"></p>
        <p><label for="correo">Correo electrónico:</label><br><input type="email" id="correo" name="correo"></p>
        <p><label for="telefono">Teléfono:</label><br><input type="tel" id="telefono" name="telefono"></p>
        <p>Estado civil:<br>
            <input type="radio" id="soltero" name="estado_civil" value="soltero"><label for="soltero">Soltero/a</label>
            <input type="radio" id="casado" name="estado_civil" value="casado"><label for="casado">Casado/a</label>
            <input type="radio" id="separado" name="estado_civil" value="separado"><label for="separado">Separado/a</label>
            <input type="radio" id="viudo" name="estado_civil" value="viudo"><label for="viudo">Viudo/a</label>
        </p>
        <p>Sexo:<br>
            <input type="radio" id="hombre" name="sexo" value="hombre"><label for="hombre">Hombre</label>
            <input type="radio" id="mujer" name="sexo" value="mujer"><label for="mujer">Mujer</label>
        </p>
    </fieldset>
    <fieldset>
        <legend>Otra información de interés</legend>
        <p><label for="componentes">Seleccione los componentes electrónicos con los que habitualmente trabajas:</label><br>
        <select id="componentes" name="componentes" multiple size="4">
            <option value="movil">Móvil</option><option value="tablet">Tablet</option><option value="ordenador">Ordenador</option><option value="ebook">Ebook</option>
        </select></p>
        <p>Seleccione tus actividades favoritas:</p>
        <p>
            <input type="checkbox" id="deporte" name="actividades" value="deporte"><label for="deporte">Hacer deporte</label><br>
            <input type="checkbox" id="senderismo" name="actividades" value="senderismo"><label for="senderismo">Realizar rutas de senderismo</label><br>
            <input type="checkbox" id="amigos" name="actividades" value="amigos"><label for="amigos">Salir con mis amigos</label><br>
            <input type="checkbox" id="cine" name="actividades" value="cine"><label for="cine">Ir al cine</label><br>
            <input type="checkbox" id="series" name="actividades" value="series"><label for="series">Ver series, pelis,...</label><br>
            <input type="checkbox" id="musica" name="actividades" value="musica"><label for="musica">Escuchar música</label>
        </p>
        <p><label for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label><br>
        <textarea id="motivo" name="motivo" rows="4" cols="50"></textarea></p>
        <p><label for="pelicula">Elige o escribe tu peli favorita:</label><br><input type="text" id="pelicula" name="pelicula"></p>
    </fieldset>
    <p><button type="submit">Enviar</button> <button type="reset">Cancelar</button></p>
</form>
</main>
<footer><a href="index.html">Volver a Formularios</a></footer>
</body>
</html>
